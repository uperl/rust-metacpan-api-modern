[package]
name = "metacpan-api-modern"
version = "0.2.0"
edition = "2024"
description = "Modern interface to the Metacpan API"
repository = "https://github.com/uperl/metacpan-api-modern"
license = "MIT"
keywords = ["metacpan", "cpan", "perl", "api-client"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
